<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>SkyRoute API Documentation</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css" />
    <style>
      body { margin: 0; padding: 0; background: #fafafa; font-family: sans-serif; }
      .topbar { display: none; }
    </style>
  </head>
  <body>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-standalone-preset.js"></script>
    <script>
      window.onload = () => {
        const spec = {
  "openapi": "3.0.0",
  "info": {
    "title": "SkyRoute Flight Booking API",
    "version": "1.0.0",
    "description": "Comprehensive REST API documentation for SkyRoute. Includes user authentication, flight schedules & searches, seat allocations, booking workflows, and administrative management."
  },
  "servers": [
    {
      "url": "/",
      "description": "Current Server Instance"
    }
  ],
  "components": {
    "securitySchemes": {
      "BearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT",
        "description": "Session token returned by register or login endpoints. Pass as `Authorization: Bearer <token>` or as a cookie (`skyroute_session`)."
      }
    },
    "schemas": {
      "RegisterInput": {
        "type": "object",
        "properties": {
          "fullName": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100
          },
          "email": {
            "type": "string",
            "maxLength": 120,
            "format": "email"
          },
          "phone": {
            "type": "string",
            "minLength": 1,
            "maxLength": 20
          },
          "password": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          },
          "confirmPassword": {
            "type": "string",
            "minLength": 1
          }
        },
        "required": [
          "fullName",
          "email",
          "phone",
          "password",
          "confirmPassword"
        ]
      },
      "LoginInput": {
        "type": "object",
        "properties": {
          "email": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "password": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          }
        },
        "required": [
          "email",
          "password"
        ]
      },
      "ChangePasswordInput": {
        "type": "object",
        "properties": {
          "currentPassword": {
            "type": "string",
            "minLength": 1
          },
          "newPassword": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          }
        },
        "required": [
          "currentPassword",
          "newPassword"
        ]
      },
      "UpdateProfileInput": {
        "type": "object",
        "properties": {
          "fullName": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100
          },
          "phone": {
            "type": "string",
            "maxLength": 20
          },
          "avatarUrl": {
            "type": "string",
            "nullable": true,
            "format": "uri"
          }
        }
      },
      "SearchFlightInput": {
        "type": "object",
        "properties": {
          "originCode": {
            "type": "string",
            "pattern": "^[A-Z]{3}$"
          },
          "destinationCode": {
            "type": "string",
            "pattern": "^[A-Z]{3}$"
          },
          "departureDate": {
            "type": "string",
            "pattern": "^\\d{4}-\\d{2}-\\d{2}$"
          },
          "tripType": {
            "type": "string",
            "enum": [
              "one-way",
              "round-trip",
              "multi-city"
            ],
            "default": "one-way"
          },
          "returnDate": {
            "type": "string",
            "pattern": "^\\d{4}-\\d{2}-\\d{2}$"
          },
          "extraLegs": {
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "originCode": {
                  "type": "string",
                  "pattern": "^[A-Z]{3}$"
                },
                "destinationCode": {
                  "type": "string",
                  "pattern": "^[A-Z]{3}$"
                },
                "departureDate": {
                  "type": "string",
                  "pattern": "^\\d{4}-\\d{2}-\\d{2}$"
                }
              },
              "required": [
                "originCode",
                "destinationCode",
                "departureDate"
              ]
            },
            "maxItems": 5
          },
          "cabin": {
            "type": "string",
            "enum": [
              "economy",
              "business",
              "first"
            ],
            "default": "economy"
          },
          "adults": {
            "type": "integer",
            "minimum": 1,
            "maximum": 9
          },
          "children": {
            "type": "integer",
            "nullable": true,
            "minimum": 0,
            "maximum": 8,
            "default": 0
          },
          "infants": {
            "type": "integer",
            "nullable": true,
            "minimum": 0,
            "maximum": 8,
            "default": 0
          }
        },
        "required": [
          "originCode",
          "destinationCode",
          "departureDate",
          "adults"
        ]
      },
      "AlternativeDatesInput": {
        "type": "object",
        "properties": {
          "originCode": {
            "type": "string",
            "pattern": "^[A-Z]{3}$"
          },
          "destinationCode": {
            "type": "string",
            "pattern": "^[A-Z]{3}$"
          }
        },
        "required": [
          "originCode",
          "destinationCode"
        ]
      },
      "CreateBookingInput": {
        "type": "object",
        "properties": {
          "legs": {
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "flightId": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 80
                },
                "cabin": {
                  "type": "string",
                  "enum": [
                    "economy",
                    "business",
                    "first"
                  ]
                },
                "seatIds": {
                  "type": "array",
                  "items": {
                    "type": "string",
                    "nullable": true,
                    "pattern": "^\\d{1,3}[A-K]$"
                  },
                  "maxItems": 9
                }
              },
              "required": [
                "flightId",
                "cabin",
                "seatIds"
              ]
            },
            "minItems": 1,
            "maxItems": 6
          },
          "tripType": {
            "type": "string",
            "enum": [
              "one-way",
              "round-trip",
              "multi-city"
            ]
          },
          "contactEmail": {
            "type": "string",
            "maxLength": 120,
            "format": "email"
          },
          "contactPhone": {
            "type": "string",
            "minLength": 1,
            "maxLength": 20
          },
          "passengers": {
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "title": {
                  "type": "string",
                  "enum": [
                    "Mr",
                    "Mrs",
                    "Miss",
                    "Ms",
                    "Dr"
                  ]
                },
                "firstName": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 50
                },
                "lastName": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 50
                },
                "dateOfBirth": {
                  "type": "string",
                  "pattern": "^\\d{4}-\\d{2}-\\d{2}$"
                },
                "gender": {
                  "type": "string",
                  "enum": [
                    "male",
                    "female"
                  ]
                },
                "passportNumber": {
                  "type": "string",
                  "maxLength": 20
                },
                "type": {
                  "type": "string",
                  "enum": [
                    "adult",
                    "child",
                    "infant"
                  ]
                }
              },
              "required": [
                "title",
                "firstName",
                "lastName",
                "dateOfBirth",
                "gender",
                "type"
              ]
            },
            "minItems": 1,
            "maxItems": 9
          },
          "payment": {
            "type": "object",
            "properties": {
              "method": {
                "type": "string",
                "enum": [
                  "card",
                  "transfer",
                  "wallet"
                ]
              },
              "cardHolder": {
                "type": "string",
                "maxLength": 80
              },
              "cardNumber": {
                "type": "string",
                "maxLength": 25
              },
              "expiry": {
                "type": "string",
                "maxLength": 7
              },
              "cvv": {
                "type": "string",
                "maxLength": 4
              },
              "senderName": {
                "type": "string",
                "maxLength": 80
              },
              "forceFailure": {
                "type": "boolean"
              }
            },
            "required": [
              "method"
            ]
          }
        },
        "required": [
          "legs",
          "contactEmail",
          "contactPhone",
          "passengers",
          "payment"
        ]
      },
      "ManagePnrInput": {
        "type": "object",
        "properties": {
          "pnr": {
            "type": "string",
            "pattern": "^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{6}$"
          },
          "surname": {
            "type": "string",
            "minLength": 1,
            "maxLength": 50
          }
        },
        "required": [
          "pnr",
          "surname"
        ]
      },
      "PnrParam": {
        "type": "object",
        "properties": {
          "pnr": {
            "type": "string",
            "pattern": "^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{6}$"
          }
        },
        "required": [
          "pnr"
        ]
      },
      "CancelBookingInput": {
        "type": "object",
        "properties": {
          "surname": {
            "type": "string",
            "minLength": 1,
            "maxLength": 50
          }
        }
      },
      "AdminFlightQuery": {
        "type": "object",
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "scheduled",
              "delayed",
              "cancelled"
            ]
          },
          "originCode": {
            "type": "string",
            "pattern": "^[A-Z]{3}$"
          },
          "destinationCode": {
            "type": "string",
            "pattern": "^[A-Z]{3}$"
          },
          "from": {
            "type": "string",
            "pattern": "^\\d{4}-\\d{2}-\\d{2}$"
          },
          "to": {
            "type": "string",
            "pattern": "^\\d{4}-\\d{2}-\\d{2}$"
          },
          "page": {
            "type": "integer",
            "minimum": 1,
            "default": 1
          },
          "pageSize": {
            "type": "integer",
            "minimum": 1,
            "maximum": 200,
            "default": 50
          }
        }
      },
      "AdminBookingQuery": {
        "type": "object",
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "confirmed",
              "cancelled",
              "pending"
            ]
          },
          "page": {
            "type": "integer",
            "minimum": 1,
            "default": 1
          },
          "pageSize": {
            "type": "integer",
            "minimum": 1,
            "maximum": 200,
            "default": 50
          }
        }
      },
      "CreateFlightInput": {
        "type": "object",
        "properties": {
          "flightNumber": {
            "type": "string",
            "pattern": "^[A-Z0-9]{2,8}$"
          },
          "airline": {
            "type": "string",
            "minLength": 1,
            "maxLength": 60
          },
          "airlineCode": {
            "type": "string",
            "pattern": "^[A-Z0-9]{2,3}$"
          },
          "originCode": {
            "type": "string",
            "pattern": "^[A-Z]{3}$"
          },
          "destinationCode": {
            "type": "string",
            "pattern": "^[A-Z]{3}$"
          },
          "departureTime": {
            "type": "string",
            "format": "date-time"
          },
          "arrivalTime": {
            "type": "string",
            "format": "date-time"
          },
          "aircraft": {
            "type": "string",
            "minLength": 1,
            "maxLength": 60
          },
          "baseFare": {
            "type": "integer",
            "minimum": 1000,
            "maximum": 50000000
          },
          "currency": {
            "type": "string",
            "minLength": 3,
            "maxLength": 3
          },
          "blockedSeats": {
            "type": "array",
            "items": {
              "type": "string",
              "maxLength": 5
            },
            "maxItems": 200
          },
          "status": {
            "type": "string",
            "enum": [
              "scheduled",
              "delayed",
              "cancelled"
            ]
          }
        },
        "required": [
          "flightNumber",
          "airline",
          "airlineCode",
          "originCode",
          "destinationCode",
          "departureTime",
          "arrivalTime",
          "aircraft",
          "baseFare"
        ]
      },
      "UpdateFlightInput": {
        "type": "object",
        "properties": {
          "flightNumber": {
            "type": "string",
            "pattern": "^[A-Z0-9]{2,8}$"
          },
          "airline": {
            "type": "string",
            "minLength": 1,
            "maxLength": 60
          },
          "airlineCode": {
            "type": "string",
            "pattern": "^[A-Z0-9]{2,3}$"
          },
          "originCode": {
            "type": "string",
            "pattern": "^[A-Z]{3}$"
          },
          "destinationCode": {
            "type": "string",
            "pattern": "^[A-Z]{3}$"
          },
          "departureTime": {
            "type": "string",
            "format": "date-time"
          },
          "arrivalTime": {
            "type": "string",
            "format": "date-time"
          },
          "aircraft": {
            "type": "string",
            "minLength": 1,
            "maxLength": 60
          },
          "baseFare": {
            "type": "integer",
            "minimum": 1000,
            "maximum": 50000000
          },
          "currency": {
            "type": "string",
            "minLength": 3,
            "maxLength": 3
          },
          "blockedSeats": {
            "type": "array",
            "items": {
              "type": "string",
              "maxLength": 5
            },
            "maxItems": 200
          },
          "status": {
            "type": "string",
            "enum": [
              "scheduled",
              "delayed",
              "cancelled"
            ]
          }
        }
      },
      "SetRoleInput": {
        "type": "object",
        "properties": {
          "role": {
            "type": "string",
            "enum": [
              "customer",
              "admin"
            ]
          }
        },
        "required": [
          "role"
        ]
      },
      "ExtendScheduleInput": {
        "type": "object",
        "properties": {
          "horizonDays": {
            "type": "integer",
            "minimum": 1,
            "maximum": 365
          }
        }
      }
    },
    "parameters": {}
  },
  "paths": {
    "/api/health": {
      "get": {
        "tags": [
          "System"
        ],
        "summary": "Health Check",
        "description": "Database liveness and server uptime probe.",
        "responses": {
          "200": {
            "description": "Server and database are healthy.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "status": {
                      "type": "string",
                      "enum": [
                        "ok"
                      ]
                    },
                    "database": {
                      "type": "string",
                      "enum": [
                        "reachable"
                      ]
                    },
                    "latencyMs": {
                      "type": "number"
                    },
                    "uptimeSeconds": {
                      "type": "number"
                    }
                  },
                  "required": [
                    "status",
                    "database",
                    "latencyMs",
                    "uptimeSeconds"
                  ]
                }
              }
            }
          },
          "503": {
            "description": "Database is unreachable / degraded service.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "status": {
                      "type": "string",
                      "enum": [
                        "degraded"
                      ]
                    },
                    "database": {
                      "type": "string",
                      "enum": [
                        "unreachable"
                      ]
                    }
                  },
                  "required": [
                    "status",
                    "database"
                  ]
                }
              }
            }
          }
        }
      }
    },
    "/api/auth/register": {
      "post": {
        "tags": [
          "Auth"
        ],
        "summary": "Register Account",
        "description": "Create a new user account with credentials, issuing a session cookie and bearer token.",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "fullName": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 100
                  },
                  "email": {
                    "type": "string",
                    "maxLength": 120,
                    "format": "email"
                  },
                  "phone": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 20
                  },
                  "password": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 200
                  },
                  "confirmPassword": {
                    "type": "string",
                    "minLength": 1
                  }
                },
                "required": [
                  "fullName",
                  "email",
                  "phone",
                  "password",
                  "confirmPassword"
                ]
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "User registered successfully.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "user": {
                      "type": "object",
                      "properties": {
                        "id": {
                          "type": "string"
                        },
                        "email": {
                          "type": "string"
                        },
                        "fullName": {
                          "type": "string"
                        },
                        "phone": {
                          "type": "string",
                          "nullable": true
                        },
                        "role": {
                          "type": "string"
                        }
                      },
                      "required": [
                        "id",
                        "email",
                        "fullName",
                        "phone",
                        "role"
                      ]
                    },
                    "token": {
                      "type": "string"
                    },
                    "expiresAt": {
                      "type": "string"
                    }
                  },
                  "required": [
                    "user",
                    "token",
                    "expiresAt"
                  ]
                }
              }
            }
          },
          "400": {
            "description": "Validation failure or password mismatch."
          },
          "409": {
            "description": "Email is already registered."
          },
          "429": {
            "description": "Too many attempts from this IP."
          }
        }
      }
    },
    "/api/auth/login": {
      "post": {
        "tags": [
          "Auth"
        ],
        "summary": "Sign In",
        "description": "Sign in with email and password.",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "email": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 120
                  },
                  "password": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 200
                  }
                },
                "required": [
                  "email",
                  "password"
                ]
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Signed in successfully.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "user": {
                      "type": "object",
                      "properties": {
                        "id": {
                          "type": "string"
                        },
                        "email": {
                          "type": "string"
                        },
                        "fullName": {
                          "type": "string"
                        },
                        "role": {
                          "type": "string"
                        }
                      },
                      "required": [
                        "id",
                        "email",
                        "fullName",
                        "role"
                      ]
                    },
                    "token": {
                      "type": "string"
                    },
                    "expiresAt": {
                      "type": "string"
                    }
                  },
                  "required": [
                    "user",
                    "token",
                    "expiresAt"
                  ]
                }
              }
            }
          },
          "400": {
            "description": "Validation failure."
          },
          "401": {
            "description": "Invalid email or password."
          },
          "429": {
            "description": "Too many attempts from this IP."
          }
        }
      }
    },
    "/api/auth/logout": {
      "post": {
        "tags": [
          "Auth"
        ],
        "summary": "Sign Out Current Session",
        "description": "Revoke the current session token and clear the session cookie.",
        "responses": {
          "204": {
            "description": "Signed out successfully."
          }
        }
      }
    },
    "/api/auth/logout-all": {
      "post": {
        "tags": [
          "Auth"
        ],
        "summary": "Sign Out All Devices",
        "description": "Revoke all active sessions for the authenticated user.",
        "security": [
          {
            "BearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "All sessions revoked.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "sessionsRevoked": {
                      "type": "number"
                    }
                  },
                  "required": [
                    "sessionsRevoked"
                  ]
                }
              }
            }
          },
          "401": {
            "description": "Authentication required."
          }
        }
      }
    },
    "/api/auth/me": {
      "get": {
        "tags": [
          "Auth"
        ],
        "summary": "Current Profile",
        "description": "Returns the profile of the currently signed-in user or null if anonymous.",
        "responses": {
          "200": {
            "description": "Profile object or null.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "user": {
                      "type": "object",
                      "nullable": true,
                      "additionalProperties": {
                        "nullable": true
                      }
                    },
                    "linkedProviders": {
                      "type": "array",
                      "items": {
                        "type": "string"
                      }
                    }
                  },
                  "required": [
                    "user"
                  ]
                }
              }
            }
          }
        }
      },
      "patch": {
        "tags": [
          "Auth"
        ],
        "summary": "Update Profile",
        "description": "Update the authenticated user's name, phone, or avatar.",
        "security": [
          {
            "BearerAuth": []
          }
        ],
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "fullName": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 100
                  },
                  "phone": {
                    "type": "string",
                    "maxLength": 20
                  },
                  "avatarUrl": {
                    "type": "string",
                    "nullable": true,
                    "format": "uri"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Profile updated successfully."
          },
          "400": {
            "description": "Validation failure."
          },
          "401": {
            "description": "Authentication required."
          }
        }
      }
    },
    "/api/auth/change-password": {

            "name": "departureDate",

            "required": false,
            "name": "tripType",
            "in": "query"
          },
          {
            "schema": {
              "type": "string",
              "pattern": "^\\d{4}-\\d{2}-\\d{2}$"
            },
            "required": false,
            "name": "returnDate",
            "in": "query"
          },
          {
            "schema": {
              "type": "array",
              "items": {
                "type": "object",
                "properties": {
                  "originCode": {
                    "type": "string",
                    "pattern": "^[A-Z]{3}$"
                  },
                  "destinationCode": {
                    "type": "string",
                    "pattern": "^[A-Z]{3}$"
                  },
                  "departureDate": {
                    "type": "string",
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$"
                  }
                },
                "required": [
                  "originCode",
                  "destinationCode",
                  "departureDate"

              },

            "required": false,
            "name": "extraLegs",
            "in": "query"
          },
          {
            "schema": {
              "type": "string",
              "enum": [
                "economy",
                "business",
                "first"
              ],
              "default": "economy"
            },
            "required": false,
            "name": "cabin",
            "in": "query"
          },
          {
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 9
            },
            "required": true,
            "name": "adults",
            "in": "query"
          },
          {
            "schema": {
              "type": "integer",
              "nullable": true,
              "minimum": 0,
              "maximum": 8,
              "default": 0
            },
            "required": false,
            "name": "children",
            "in": "query"
          },
          {
            "schema": {
              "type": "integer",
              "nullable": true,
              "minimum": 0,
              "maximum": 8,
              "default": 0
            },
            "required": false,
            "name": "infants",
            "in": "query"
          }
        ],
        "responses": {
          "200": {
            "description": "Search results with itineraries and seat availability."
          },
          "400": {
            "description": "Validation failure (e.g. invalid date or airport codes)."
          }
        }
      },
      "post": {
        "tags": [
          "Flights"
        ],
        "summary": "Search Flights (POST)",
        "description": "Search for available flights using JSON body. Ideal for complex multi-city queries.",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "originCode": {
                    "type": "string",
                    "pattern": "^[A-Z]{3}$"
                  },
                  "destinationCode": {
                    "type": "string",
                    "pattern": "^[A-Z]{3}$"
                  },
                  "departureDate": {
                    "type": "string",
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$"
                  },
                  "tripType": {
                    "type": "string",
                    "enum": [
                      "one-way",
                      "round-trip",
                      "multi-city"

                    "default": "one-way"
                  },
                  "returnDate": {
                    "type": "string",
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$"
                  },
                  "extraLegs": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "properties": {
                        "originCode": {
                          "type": "string",
                          "pattern": "^[A-Z]{3}$"
                        },
                        "destinationCode": {
                          "type": "string",
                          "pattern": "^[A-Z]{3}$"
                        },
                        "departureDate": {
                          "type": "string",
                          "pattern": "^\\d{4}-\\d{2}-\\d{2}$"
                        }
                      },
                      "required": [
                        "originCode",
                        "destinationCode",
                        "departureDate"
                      ]
                    },
                    "maxItems": 5
                  },
                  "cabin": {
                    "type": "string",
                    "enum": [
                      "economy",
                      "business",
                      "first"
                    ],
                    "default": "economy"
                  },
                  "adults": {
                    "type": "integer",
                    "minimum": 1,
                    "maximum": 9
                  },
                  "children": {
                    "type": "integer",
                    "nullable": true,
                    "minimum": 0,
                    "maximum": 8,
                    "default": 0
                  },
                  "infants": {
                    "type": "integer",
                    "nullable": true,
                    "minimum": 0,
                    "maximum": 8,
                    "default": 0

                "required": [

                  "destinationCode",
                  "departureDate",

        "responses": {

            "description": "Validation failure."

      "post": {
        "tags": [
          "Bookings"
        ],
        "summary": "Create Booking",
        "description": "Create a new flight reservation with passenger details and payment. Supports guest and authenticated bookings.",
        "security": [
          {
            "BearerAuth": []
          }
        ],
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "legs": {
                    "type": "array",

                      "type": "object",
                      "properties": {
                        "flightId": {
                          "type": "string",

                          "maxLength": 80
                        },
                        "cabin": {
                          "type": "string",
                          "enum": [
                            "economy",
                            "business",
                            "first"
                          ]
                        },
                        "seatIds": {
                          "type": "array",
                          "items": {
                            "type": "string",
                            "nullable": true,
                            "pattern": "^\\d{1,3}[A-K]$"
                          },
                          "maxItems": 9
                        }
                      },
                      "required": [
                        "flightId",
                        "cabin",
                        "seatIds"
                      ]
                    },
                    "minItems": 1,
                    "maxItems": 6
                  },
                  "tripType": {
                    "type": "string",
                    "enum": [
                      "one-way",
                      "round-trip",
                      "multi-city"
                    ]
                  },
                  "contactEmail": {
                    "type": "string",
                    "maxLength": 120,
                    "format": "email"
                  },
                  "contactPhone": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 20
                  },
                  "passengers": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "properties": {
                        "title": {
                          "type": "string",
                          "enum": [
                            "Mr",
                            "Mrs",
                            "Miss",
                            "Ms",
                            "Dr"
                          ]
                        },
                        "firstName": {
                          "type": "string",
                          "minLength": 1,
                          "maxLength": 50
                        },
                        "lastName": {
                          "type": "string",
                          "minLength": 1,
                          "maxLength": 50
                        },
                        "dateOfBirth": {
                          "type": "string",
                          "pattern": "^\\d{4}-\\d{2}-\\d{2}$"
                        },
                        "gender": {
                          "type": "string",
                          "enum": [
                            "male",
                            "female"
                          ]
                        },
                        "passportNumber": {
                          "type": "string",
                          "maxLength": 20
                        },
                        "type": {
                          "type": "string",
                          "enum": [
                            "adult",
                            "child",
                            "infant"
                          ]
                        }
                      },
                      "required": [
                        "title",
                        "firstName",
                        "lastName",
                        "dateOfBirth",
                        "gender",
                        "type"
                      ]
                    },
                    "minItems": 1,
                    "maxItems": 9
                  },
                  "payment": {
                    "type": "object",
                    "properties": {
                      "method": {
                        "type": "string",
                        "enum": [
                          "card",
                          "transfer",
                          "wallet"
                        ]
                      },
                      "cardHolder": {
                        "type": "string",
                        "maxLength": 80
                      },
                      "cardNumber": {
                        "type": "string",
                        "maxLength": 25
                      },
                      "expiry": {
                        "type": "string",
                        "maxLength": 7
                      },
                      "cvv": {
                        "type": "string",
                        "maxLength": 4
                      },
                      "senderName": {
                        "type": "string",
                        "maxLength": 80
                      },
                      "forceFailure": {
                        "type": "boolean"
                      }
                    },
                    "required": [
                      "method"
                    ]
                  }
                },
                "required": [
                  "legs",
                  "contactEmail",
                  "contactPhone",
                  "passengers",
                  "payment"
                ]
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Booking confirmed with PNR reference."
          },
          "400": {
            "description": "Validation error, seat unavailable, or invalid payment."
          }
